[project]
name = "agent-crew-workflows"
version = "0.1.0"
description = "Production-oriented AI development workflows using agent orchestration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Abraham Leal" }
]
keywords = [
    "ai",
    "agents",
    "crewai",
    "workflow",
    "developer-tools",
    "automation"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools"
]

dependencies = [
    "crewai>=0.100.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0"
]

[project.urls]
Repository = "https://github.com/sonOfDocker/agent-crew-workflows"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
python_files = [
    "test_*.py"
]
python_classes = [
    "Test*"
]
python_functions = [
    "test_*"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B"
]
ignore = []
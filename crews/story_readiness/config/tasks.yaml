# Tasks for Story Readiness Workflow

refine_story_task:
  description: >
    Review the input story: {story_input}
    
    Using the project context: {project_context}
    
    Current date: {current_date}
    
    Your goal is to refine this story into a professional, implementation-ready document.
    
    You MUST include the following sections in your output:
    - # Story Refinement
    - ## Source Story Summary: Briefly summarize the original story.
    - ## Refined Story Summary: Provide a clearer version of the story goal and expected outcome.
    - ## Requirements: List functional and non-functional requirements identified.
    - ## Acceptance Criteria Review: Review if existing AC are clear and complete; suggest improvements.
    - ## Assumptions: List anything inferred but not verified. Do not present as facts.
    - ## Open Questions: List questions requiring human clarification.
    - ## Out of Scope: List items that should not be included.
    - ## Readiness Assessment: State if ready, partially ready, or not ready.
    - ## Human Review Needed: Specific decisions or confirmations needed.

    IMPORTANT: Your output is advisory and requires human review. Do NOT claim the story is finished or implementation is complete.
  expected_output: >
    A refined markdown story with all required sections, clear AC, and identified boundaries.
  agent: story_refiner
  output_file: story-refinement.md

produce_architecture_notes_task:
  description: >
    Review the refined story produced by the Story Refiner.
    
    Using the project context: {project_context}
    
    You MUST include the following sections in your output:
    - # Architecture Notes
    - ## Architecture Summary: Summarize the recommended architectural direction.
    - ## Relevant Context: Reference important project context used.
    - ## Impacted Areas: List likely files, packages, modules, or docs affected.
    - ## Proposed Approach: Describe the recommended approach clearly.
    - ## Alternatives Considered: List alternatives and why they were not selected.
    - ## Risks and Tradeoffs: Identify risks, complexity, or maintainability concerns.
    - ## Documentation Impact: State if docs, ADRs, or READMEs should be updated.
    - ## Human Review Needed: List architectural decisions requiring human confirmation.

    IMPORTANT: Your output is advisory and requires human review. Do NOT claim the design is finalized or implementation has started.
  expected_output: >
    A technical design document with all required sections, providing clear architectural guidance.
  agent: architect
  output_file: architecture-notes.md

produce_test_plan_task:
  description: >
    Review the refined story and architecture notes.
    
    You MUST include the following sections in your output:
    - # Test Plan
    - ## Test Strategy Summary: Summarize the overall testing approach.
    - ## Acceptance Criteria Mapping: Map each AC to one or more validation steps.
    - ## Required Tests: List tests that MUST be implemented or executed.
    - ## Optional Tests: List useful but non-required tests.
    - ## Edge Cases: List failure modes, boundary cases, or unusual inputs.
    - ## Suggested Test Commands: List expected commands (e.g., pytest).
    - ## Required Evidence: List evidence needed (e.g., test output, artifacts).
    - ## Human Review Needed: List test strategy decisions requiring human confirmation.

    IMPORTANT: Your output is advisory and requires human review. Do NOT claim tests have passed.
  expected_output: >
    A comprehensive test plan with all required sections and AC mapping.
  agent: test_strategist
  output_file: test-plan.md

produce_implementation_plan_task:
  description: >
    Produce an implementation plan based on the refined story, architecture notes, and test strategy.
    
    You MUST include the following sections in your output:
    - # Implementation Plan
    - ## Implementation Summary: Summarize the intended implementation approach.
    - ## Planned File Changes: List expected files/directories to create or update.
    - ## Step-by-Step Plan: Provide ordered, practical implementation steps.
    - ## Test Execution Plan: Describe when and how tests should be run.
    - ## Risks and Blockers: List implementation risks, dependencies, or blockers.
    - ## Assumptions: List assumptions affecting the implementation plan.
    - ## Completion Evidence Needed: List artifacts or results needed before completion.
    - ## Human Approval Needed Before Changes: Clearly state required human approval.

    IMPORTANT: Your output is advisory and requires human review. Do NOT claim work is complete or files have been modified.
  expected_output: >
    An implementation plan with all required sections, guiding the next steps of development.
  agent: developer
  output_file: implementation-plan.md

produce_review_notes_task:
  description: >
    Review all planning artifacts produced by the previous agents (refinement, architecture, test plan, implementation plan).
    
    You MUST include the following sections in your output:
    - # Review Notes
    - ## Review Summary: Summarize the review outcome.
    - ## Artifacts Reviewed: List the artifacts reviewed.
    - ## Acceptance Criteria Status: List each AC and its status (e.g., satisfied, unclear).
    - ## Evidence Reviewed: List the evidence available (e.g., state if no test output exists).
    - ## Issues Found: List problems, inconsistencies, or unsupported claims.
    - ## Required Changes: List changes required before approval.
    - ## Suggested Improvements: List non-blocking improvements.
    - ## Final Recommendation: (Approve for next step / Changes requested / Blocked / Needs human decision).
    - ## Human Decision Needed: List decisions the human owner must make.

    IMPORTANT: Your output is advisory and requires human review.
  expected_output: >
    A detailed review report with all required sections and a clear recommendation.
  agent: reviewer
  output_file: review-notes.md

produce_final_summary_task:
  description: >
    Summarize all generated outputs and list next human actions.
    
    You MUST include the following sections in your output:
    - # Final Summary
    - ## Workflow Run Summary: Summarize what the workflow did.
    - ## Inputs Used: List context file ({context_path}) and story file ({story_path}).
    - ## Artifacts Generated: List generated artifact file names.
    - ## Key Findings: Summarize most important findings from the workflow.
    - ## Open Questions: List unresolved questions from across artifacts.
    - ## Required Human Actions: List actions the human owner should take next.
    - ## Limitations: State limitations (e.g., no code changed, AI-generated).
    - ## Recommended Next Step: Recommend one clear next step.

    Include the output directory: {output_dir}
    IMPORTANT: Your output is advisory and requires human review.
  expected_output: >
    A final summary document with all required sections, providing a clear path forward.
  agent: reviewer
  output_file: final-summary.md

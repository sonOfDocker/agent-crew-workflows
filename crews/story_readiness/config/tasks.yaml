# Tasks for Story Readiness Workflow

refine_story_task:
  description: >
    Review the input story: {story_input}
    
    Using the project context: {project_context}
    
    Current date: {current_date}
    
    Your goal is to refine this story into a professional, implementation-ready document.
    1. Clarify the core goal and value.
    2. Define specific, testable acceptance criteria (AC).
    3. Identify what is in-scope vs out-of-scope.
    4. List any open questions or assumptions.
    
    Follow the standard story template format.
    IMPORTANT: Your output is advisory and requires human review.
  expected_output: >
    A refined markdown story following the project's standard template, with clear AC and boundaries.
  agent: story_refiner
  output_file: story-refinement.md

produce_architecture_notes_task:
  description: >
    Review the refined story produced by the Story Refiner.
    
    Using the project context: {project_context}
    
    1. Identify affected files, modules, or components.
    2. Propose a technical implementation approach.
    3. Identify architectural risks or tradeoffs.
    4. Determine if an ADR is required.
    
    Add these as 'Technical Notes' and 'Architecture' sections.
    IMPORTANT: Your output is advisory and requires human review.
  expected_output: >
    A technical design document including technical implementation notes and architectural assessment.
  agent: architect
  output_file: architecture-notes.md

produce_test_plan_task:
  description: >
    Review the refined story and architecture notes.
    
    1. Map every acceptance criterion to a specific validation method.
    2. Identify critical edge cases.
    3. Suggest unit and integration test scenarios.
    4. Define any required manual verification steps.
    
    IMPORTANT: Your output is advisory and requires human review.
  expected_output: >
    A comprehensive test plan that includes a mapping of AC to validation methods and identified edge cases.
  agent: test_strategist
  output_file: test-plan.md

produce_implementation_plan_task:
  description: >
    Produce an implementation plan based on the refined story, architecture notes, and test strategy.
    
    1. List the specific code and test changes needed to satisfy all AC.
    2. Ensure the plan follows the proposed architecture approach.
    3. Do NOT modify any source files. Only describe the plan.
    
    IMPORTANT: Your output is advisory and requires human review.
  expected_output: >
    An implementation plan containing a summary of planned code and test changes and AC mapping.
  agent: developer
  output_file: implementation-plan.md

produce_review_notes_task:
  description: >
    Review all planning artifacts produced by the previous agents (refinement, architecture, test plan, implementation plan).
    
    1. Verify each AC is addressed in the plan.
    2. Check for adherence to architecture and project standards.
    3. Look for any regressions or out-of-scope changes in the implementation plan.
    4. Provide a recommendation (Approve/Revise).
    
    IMPORTANT: Your output is advisory and requires human review.
  expected_output: >
    A detailed review report with a clear recommendation and AC verification checklist.
  agent: reviewer
  output_file: review-notes.md

produce_final_summary_task:
  description: >
    Summarize all generated outputs and list next human actions.
    Make it clear that the workflow output is advisory and requires human review.
    Include a summary of the context file used and the story file used.
  expected_output: >
    A final summary document listing next steps and advisory notice.
  agent: reviewer
  output_file: final-summary.md
